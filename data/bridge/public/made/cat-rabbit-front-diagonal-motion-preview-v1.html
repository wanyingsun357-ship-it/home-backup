<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7eeeb" />
  <title>猫兔前斜试跑场 v1</title>
  <style>
    :root { color-scheme: light; --ink:#514449; --muted:#8f7d84; --wine:#944e60; --line:rgba(110,77,87,.13); }
    * { box-sizing:border-box; }
    html,body { min-height:100%; margin:0; }
    body {
      font-family:ui-rounded,"SF Pro Rounded","PingFang SC",system-ui,sans-serif;
      color:var(--ink);
      background:radial-gradient(circle at 16% 8%,rgba(220,183,199,.36),transparent 32%),radial-gradient(circle at 88% 22%,rgba(207,195,231,.38),transparent 34%),linear-gradient(160deg,#fbf4f0 0%,#f5efed 48%,#efe9f1 100%);
      padding:max(22px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
    }
    main { width:min(720px,100%); margin:0 auto; }
    header { padding:4px 6px 14px; }
    h1 { margin:0; font-size:clamp(23px,7vw,32px); font-weight:760; letter-spacing:.02em; }
    header p { margin:8px 0 0; color:var(--muted); font-size:14px; line-height:1.6; }
    .stage-shell { position:relative; overflow:hidden; border:1px solid rgba(255,255,255,.76); border-radius:28px; background:rgba(255,253,250,.82); box-shadow:0 18px 50px rgba(88,54,67,.12),inset 0 1px 0 rgba(255,255,255,.8); backdrop-filter:blur(14px); }
    canvas { display:block; width:100%; aspect-ratio:760/720; }
    .controls { margin-top:14px; padding:14px; border:1px solid rgba(255,255,255,.76); border-radius:24px; background:rgba(255,253,250,.7); box-shadow:0 10px 32px rgba(88,54,67,.08); }
    .row { display:flex; gap:9px; flex-wrap:wrap; }
    .row + .row { margin-top:10px; }
    button { appearance:none; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.7); color:var(--ink); min-height:42px; padding:9px 15px; font:inherit; font-size:14px; cursor:pointer; -webkit-tap-highlight-color:transparent; transition:transform .16s ease,background .16s ease,color .16s ease; }
    button:active { transform:scale(.96); }
    button.active,button.primary { background:var(--wine); color:#fff; border-color:transparent; }
    .run { flex:1 1 28%; }
    .direction { flex:1 1 42%; }
    .pace { flex:1 1 27%; }
    .note { margin:13px 4px 0; color:var(--muted); font-size:12px; line-height:1.65; }
    .status { color:var(--wine); font-weight:650; }
    @media (prefers-reduced-motion:reduce) { button { transition:none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>猫兔前斜试跑场 v1</h1>
      <p>十二张前斜生产帧直接来自已验收的 v4；向左下由同一组帧水平镜像，不重新画身体。</p>
    </header>
    <section class="stage-shell" aria-label="猫兔前斜运动动画预览"><canvas id="stage"></canvas></section>
    <section class="controls">
      <div class="row" aria-label="播放对象">
        <button class="run" data-run="rabbit">兔兔跑</button><button class="run" data-run="cat">猫猫跑</button><button class="run primary active" data-run="both">一起跑</button>
      </div>
      <div class="row" aria-label="方向">
        <button class="direction active" data-direction="right">斜向右下</button><button class="direction" data-direction="left">斜向左下</button>
      </div>
      <div class="row" aria-label="速度">
        <button class="pace" data-pace="slow">慢慢来</button><button class="pace active" data-pace="normal">正常</button><button class="pace" data-pace="fast">快一点</button>
      </div>
      <p class="note"><span class="status" id="status">正常速度 · 两只一起 · 斜向右下</span><br />当前读取 448×448 RGBA 前斜生产帧；统一锚点为 (224,438)，左前斜只做水平镜像。</p>
    </section>
  </main>
  <script>
    const canvas=document.querySelector('#stage');
    const ctx=canvas.getContext('2d');
    const source=new Image();
    source.src='./cat-rabbit-front-diagonal-run-atlas-v1.png';
    const WORLD={w:760,h:720};
    const FRAME_SIZE=448,ANCHOR_Y=438;
    const paceMap={slow:{progress:.075,frame:210,fade:3400,label:'慢慢来'},normal:{progress:.125,frame:135,fade:2700,label:'正常速度'},fast:{progress:.205,frame:82,fade:1900,label:'快一点'}};
    let pace='normal',mode='both',direction='right',lastTime=performance.now(),ready=false,footprints=[];
    const pets={rabbit:{row:0,t:0,frame:0,prevFrame:-1,active:true,delay:0,lane:38},cat:{row:1,t:-.12,frame:0,prevFrame:-1,active:true,delay:460,lane:-48}};
    function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(WORLD.w*dpr);canvas.height=Math.round(WORLD.h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
    function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
    function pointFor(p){const t=clamp(p.t,0,1);const y=72+t*590;const baseX=98+t*540+p.lane;return{x:direction==='right'?baseX:WORLD.w-baseX,y};}
    function sizeFor(p){return 112+clamp(p.t,0,1)*114;}
    function reset(which=mode){footprints=[];pets.rabbit.t=0;pets.rabbit.delay=0;pets.rabbit.prevFrame=-1;pets.cat.t=-.12;pets.cat.delay=which==='both'?460:0;pets.cat.prevFrame=-1;pets.rabbit.active=which==='rabbit'||which==='both';pets.cat.active=which==='cat'||which==='both';}
    function addTrack(kind,p){const point=pointFor(p);footprints.push({kind,x:point.x,y:point.y-7,scale:sizeFor(p)/210,born:performance.now(),ttl:paceMap[pace].fade,direction});}
    function drawTrack(f,alpha){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.direction==='right'?Math.PI/4:-Math.PI/4);ctx.scale(f.scale,f.scale);if(f.kind==='rabbit'){ctx.fillStyle=`rgba(157,105,196,${.42*alpha})`;ctx.beginPath();ctx.ellipse(-8,12,4.5,10,-.08,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(8,12,4.5,10,.08,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(-6,-6,3.5,5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(6,-6,3.5,5,0,0,Math.PI*2);ctx.fill();}else{ctx.fillStyle=`rgba(72,88,145,${.42*alpha})`;ctx.beginPath();ctx.ellipse(0,-4,6.5,7.2,0,0,Math.PI*2);ctx.fill();[[-7,7],[-2,11],[4,11],[9,7]].forEach(([x,y])=>{ctx.beginPath();ctx.ellipse(x,y,3.5,2.7,0,0,Math.PI*2);ctx.fill();});}ctx.restore();}
    function drawBackground(){ctx.clearRect(0,0,WORLD.w,WORLD.h);const grad=ctx.createLinearGradient(0,0,0,WORLD.h);grad.addColorStop(0,'rgba(249,244,247,.95)');grad.addColorStop(1,'rgba(255,250,247,.98)');ctx.fillStyle=grad;ctx.fillRect(0,0,WORLD.w,WORLD.h);ctx.strokeStyle='rgba(116,81,94,.075)';ctx.lineWidth=1.2;const start=direction==='right'?{x:90,y:58}:{x:670,y:58};const ends=direction==='right'?[[545,650],[650,650],[755,650]]:[[215,650],[110,650],[5,650]];ends.forEach(([x,y])=>{ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineTo(x,y);ctx.stroke();});[170,340,520,680].forEach((y,i)=>{const half=68+i*62;ctx.beginPath();ctx.moveTo(start.x-half,y);ctx.lineTo(start.x+half,y);ctx.stroke();});}
    function drawPet(p){if(!ready||!p.active||p.delay>0||p.t<0)return;const point=pointFor(p),size=sizeFor(p),cellW=source.naturalWidth/6,cellH=source.naturalHeight/2,sx=p.frame*cellW,sy=p.row*cellH,top=point.y-size*(ANCHOR_Y/FRAME_SIZE);ctx.save();ctx.fillStyle=`rgba(78,58,70,${.05+clamp(p.t,0,1)*.045})`;ctx.beginPath();ctx.ellipse(point.x,point.y+1,size*.23,size*.065,0,0,Math.PI*2);ctx.fill();ctx.translate(point.x,0);if(direction==='left')ctx.scale(-1,1);ctx.drawImage(source,sx,sy,cellW,cellH,-size/2,top,size,size);ctx.restore();}
    function updatePet(kind,p,dt,now){if(!p.active)return;if(p.delay>0){p.delay-=dt;return;}p.t+=paceMap[pace].progress*dt/1000;p.frame=Math.floor(now/paceMap[pace].frame)%6;if(p.frame!==p.prevFrame){if(kind==='rabbit'&&(p.frame===0||p.frame===5))addTrack(kind,p);if(kind==='cat'&&(p.frame===0||p.frame===4))addTrack(kind,p);p.prevFrame=p.frame;}if(p.t>1.13){p.t=kind==='rabbit'?0:-.12;p.delay=mode==='both'&&kind==='cat'?380:160;p.prevFrame=-1;}}
    function frame(now){const dt=Math.min(now-lastTime,50);lastTime=now;updatePet('rabbit',pets.rabbit,dt,now);updatePet('cat',pets.cat,dt,now);footprints=footprints.filter(f=>now-f.born<f.ttl).slice(-18);drawBackground();for(const f of footprints)drawTrack(f,1-(now-f.born)/f.ttl);[pets.rabbit,pets.cat].sort((a,b)=>a.t-b.t).forEach(drawPet);requestAnimationFrame(frame);}
    function updateStatus(){const modeLabel=mode==='both'?'两只一起':mode==='rabbit'?'只有兔兔':'只有猫猫';const directionLabel=direction==='right'?'斜向右下':'斜向左下';document.querySelector('#status').textContent=`${paceMap[pace].label} · ${modeLabel} · ${directionLabel}`;}
    document.querySelectorAll('[data-run]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.run;document.querySelectorAll('[data-run]').forEach(b=>b.classList.toggle('active',b===button));reset();updateStatus();}));
    document.querySelectorAll('[data-direction]').forEach(button=>button.addEventListener('click',()=>{direction=button.dataset.direction;document.querySelectorAll('[data-direction]').forEach(b=>b.classList.toggle('active',b===button));reset();updateStatus();}));
    document.querySelectorAll('[data-pace]').forEach(button=>button.addEventListener('click',()=>{pace=button.dataset.pace;document.querySelectorAll('[data-pace]').forEach(b=>b.classList.toggle('active',b===button));reset();updateStatus();}));
    source.onload=()=>{ready=true;reset();};
    window.addEventListener('resize',resize);resize();requestAnimationFrame(frame);
  </script>
</body>
</html>
