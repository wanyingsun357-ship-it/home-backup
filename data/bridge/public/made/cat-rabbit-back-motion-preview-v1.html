<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7eeeb" />
  <title>猫兔背向试跑场 v1</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #514449;
      --muted: #8f7d84;
      --wine: #944e60;
      --paper: rgba(255, 253, 250, .82);
      --line: rgba(110, 77, 87, .13);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 8%, rgba(220, 183, 199, .36), transparent 32%),
        radial-gradient(circle at 88% 22%, rgba(207, 195, 231, .38), transparent 34%),
        linear-gradient(160deg, #fbf4f0 0%, #f5efed 48%, #efe9f1 100%);
      padding: max(22px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    }
    main { width: min(720px, 100%); margin: 0 auto; }
    header { padding: 4px 6px 14px; }
    h1 { margin: 0; font-size: clamp(23px, 7vw, 32px); font-weight: 760; letter-spacing: .02em; }
    header p { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .stage-shell {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.76);
      border-radius: 28px;
      background: var(--paper);
      box-shadow: 0 18px 50px rgba(88,54,67,.12), inset 0 1px 0 rgba(255,255,255,.8);
      backdrop-filter: blur(14px);
    }
    canvas { display: block; width: 100%; aspect-ratio: 760 / 720; }
    .lane-labels { position: absolute; inset: 18px 20px auto; display: flex; justify-content: space-between; pointer-events: none; }
    .lane-labels span { color: rgba(83,68,74,.5); font-size: 11px; letter-spacing: .1em; }
    .controls {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.76);
      border-radius: 24px;
      background: rgba(255,253,250,.7);
      box-shadow: 0 10px 32px rgba(88,54,67,.08);
    }
    .row { display: flex; gap: 9px; flex-wrap: wrap; }
    .row + .row { margin-top: 10px; }
    button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.7);
      color: var(--ink);
      min-height: 42px;
      padding: 9px 15px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .16s ease, background .16s ease, color .16s ease;
    }
    button:active { transform: scale(.96); }
    button.active, button.primary { background: var(--wine); color: #fff; border-color: transparent; }
    .run { flex: 1 1 28%; }
    .pace { flex: 1 1 27%; }
    .note { margin: 13px 4px 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .status { color: var(--wine); font-weight: 650; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>猫兔背向试跑场 v1</h1>
      <p>两只从你眼前往页面深处跑远：越靠上越小，脚印留在身后；兔耳晚半拍起落，猫尾摆动维持平衡。</p>
    </header>

    <section class="stage-shell" aria-label="猫兔背向运动动画预览">
      <canvas id="stage"></canvas>
      <div class="lane-labels"><span>兔兔 · 蹦向深处</span><span>猫猫 · 跑向深处</span></div>
    </section>

    <section class="controls">
      <div class="row" aria-label="播放对象">
        <button class="run" data-run="rabbit">兔兔跑</button>
        <button class="run" data-run="cat">猫猫跑</button>
        <button class="run primary active" data-run="both">一起跑</button>
      </div>
      <div class="row" aria-label="速度">
        <button class="pace" data-pace="slow">慢慢来</button>
        <button class="pace active" data-pace="normal">正常</button>
        <button class="pace" data-pace="fast">快一点</button>
      </div>
      <p class="note"><span class="status" id="status">正常速度 · 两只一起</span><br />当前直接读取 448×448 背向生产帧；缩放来自屏幕纵深，不会逐帧改变身体比例。</p>
    </section>
  </main>

  <script>
    const canvas = document.querySelector('#stage');
    const ctx = canvas.getContext('2d');
    const source = new Image();
    source.src = './cat-rabbit-back-run-atlas-v1.png';

    const WORLD = { w: 760, h: 720 };
    const FRAME_SIZE = 448;
    const ANCHOR_Y = 438;
    const paceMap = {
      slow:   { py: 68,  frame: 210, fade: 3400, label: '慢慢来' },
      normal: { py: 116, frame: 135, fade: 2700, label: '正常速度' },
      fast:   { py: 188, frame: 82,  fade: 1900, label: '快一点' }
    };
    let pace = 'normal';
    let mode = 'both';
    let lastTime = performance.now();
    let footprints = [];
    let ready = false;

    const pets = {
      rabbit: { row: 0, x: 245, ground: 650, frame: 0, prevFrame: -1, active: true, delay: 0 },
      cat:    { row: 1, x: 515, ground: 710, frame: 0, prevFrame: -1, active: true, delay: 520 }
    };

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(WORLD.w * dpr);
      canvas.height = Math.round(WORLD.h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }

    function depthFor(p) { return clamp((p.ground - 45) / (WORLD.h - 80), 0, 1); }
    function sizeFor(p) { return 112 + depthFor(p) * 112; }

    function reset(which = mode) {
      footprints = [];
      pets.rabbit.ground = 650;
      pets.rabbit.delay = 0;
      pets.rabbit.frame = 0;
      pets.rabbit.prevFrame = -1;
      pets.cat.ground = 710;
      pets.cat.delay = which === 'both' ? 520 : 0;
      pets.cat.frame = 0;
      pets.cat.prevFrame = -1;
      pets.rabbit.active = which === 'rabbit' || which === 'both';
      pets.cat.active = which === 'cat' || which === 'both';
    }

    function addRabbitTrack(p) {
      footprints.push({ type: 'rabbit', x: p.x, y: p.ground - 10, scale: sizeFor(p) / 210, born: performance.now(), ttl: paceMap[pace].fade });
    }

    function addCatTrack(p) {
      footprints.push({ type: 'cat', x: p.x, y: p.ground - 8, scale: sizeFor(p) / 210, born: performance.now(), ttl: paceMap[pace].fade });
    }

    function drawRabbitTrack(f, alpha) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.scale(f.scale, f.scale);
      ctx.fillStyle = `rgba(157,105,196,${.42 * alpha})`;
      ctx.beginPath(); ctx.ellipse(-9, -15, 4.8, 10, .08, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(9, -15, 4.8, 10, -.08, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-7, 6, 3.8, 5.2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(7, 6, 3.8, 5.2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawCatTrack(f, alpha) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.scale(f.scale, f.scale);
      ctx.fillStyle = `rgba(72,88,145,${.42 * alpha})`;
      ctx.beginPath(); ctx.ellipse(0, 4, 6.5, 7.2, 0, 0, Math.PI * 2); ctx.fill();
      [[-7,-7],[-2,-11],[4,-11],[9,-7]].forEach(([x,y]) => {
        ctx.beginPath(); ctx.ellipse(x, y, 3.5, 2.7, 0, 0, Math.PI * 2); ctx.fill();
      });
      ctx.restore();
    }

    function drawBackground() {
      ctx.clearRect(0, 0, WORLD.w, WORLD.h);
      const grad = ctx.createLinearGradient(0, 0, 0, WORLD.h);
      grad.addColorStop(0, 'rgba(249,244,247,.95)');
      grad.addColorStop(1, 'rgba(255,250,247,.98)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, WORLD.w, WORLD.h);
      ctx.strokeStyle = 'rgba(116,81,94,.075)';
      ctx.lineWidth = 1.2;
      [[160,600],[380,600],[600,600]].forEach(([x,y]) => {
        ctx.beginPath(); ctx.moveTo(WORLD.w / 2, 58); ctx.lineTo(x, y); ctx.stroke();
      });
      [150, 300, 470, 650].forEach((y, index) => {
        const inset = 245 - index * 56;
        ctx.beginPath(); ctx.moveTo(inset, y); ctx.lineTo(WORLD.w - inset, y); ctx.stroke();
      });
    }

    function drawShadow(p, size) {
      const depth = depthFor(p);
      ctx.save();
      ctx.fillStyle = `rgba(78,58,70,${.05 + depth * .045})`;
      ctx.beginPath();
      ctx.ellipse(p.x, p.ground + 1, size * .23, size * .065, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPet(p) {
      if (!ready || !p.active || p.delay > 0) return;
      const cellW = source.naturalWidth / 6;
      const cellH = source.naturalHeight / 2;
      const size = sizeFor(p);
      const sx = p.frame * cellW;
      const sy = p.row * cellH;
      const top = p.ground - size * (ANCHOR_Y / FRAME_SIZE);
      drawShadow(p, size);
      ctx.drawImage(source, sx, sy, cellW, cellH, p.x - size / 2, top, size, size);
    }

    function updatePet(name, p, dt, now) {
      if (!p.active) return;
      if (p.delay > 0) { p.delay -= dt; return; }
      const config = paceMap[pace];
      p.ground -= config.py * dt / 1000;
      p.frame = Math.floor(now / config.frame) % 6;
      if (p.frame !== p.prevFrame) {
        if (name === 'rabbit' && (p.frame === 0 || p.frame === 5)) addRabbitTrack(p);
        if (name === 'cat' && (p.frame === 0 || p.frame === 4)) addCatTrack(p);
        p.prevFrame = p.frame;
      }
      if (p.ground < -70) {
        p.ground = name === 'rabbit' ? 650 : 710;
        p.delay = mode === 'both' && name === 'cat' ? 420 : 180;
        p.prevFrame = -1;
      }
    }

    function frame(now) {
      const dt = Math.min(now - lastTime, 50);
      lastTime = now;
      updatePet('rabbit', pets.rabbit, dt, now);
      updatePet('cat', pets.cat, dt, now);
      footprints = footprints.filter(f => now - f.born < f.ttl).slice(-16);

      drawBackground();
      for (const f of footprints) {
        const alpha = 1 - (now - f.born) / f.ttl;
        f.type === 'rabbit' ? drawRabbitTrack(f, alpha) : drawCatTrack(f, alpha);
      }
      [pets.rabbit, pets.cat].sort((a,b) => a.ground - b.ground).forEach(drawPet);
      requestAnimationFrame(frame);
    }

    function setActive(group, value) {
      document.querySelectorAll(group).forEach(el => el.classList.toggle('active', el.dataset.run === value || el.dataset.pace === value));
    }

    document.querySelectorAll('[data-run]').forEach(button => {
      button.addEventListener('click', () => {
        mode = button.dataset.run;
        setActive('[data-run]', mode);
        reset(mode);
        updateStatus();
      });
    });

    document.querySelectorAll('[data-pace]').forEach(button => {
      button.addEventListener('click', () => {
        pace = button.dataset.pace;
        setActive('[data-pace]', pace);
        reset(mode);
        updateStatus();
      });
    });

    function updateStatus() {
      const who = mode === 'both' ? '两只一起' : mode === 'rabbit' ? '兔兔' : '猫猫';
      document.querySelector('#status').textContent = `${paceMap[pace].label} · ${who}`;
    }

    source.addEventListener('load', () => { ready = true; reset('both'); });
    source.addEventListener('error', () => {
      document.querySelector('#status').textContent = '动作图加载失败，请刷新一次';
    });
    resize();
    addEventListener('resize', resize);
    requestAnimationFrame(frame);
  </script>
</body>
</html>
